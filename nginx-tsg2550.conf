# /etc/nginx/sites-available/tsg2550.com
#
# ติดตั้ง:
#   cp nginx-tsg2550.conf /etc/nginx/sites-available/tsg2550.com
#   ln -s /etc/nginx/sites-available/tsg2550.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# บล็อก SSL (listen 443 / ssl_certificate) ปล่อยให้ certbot เติมให้เอง
# เหมือน tasks.codecipher.co กับ api.top-dee.com — อย่าเขียนเอง

server {
    listen 80;
    listen [::]:80;
    server_name tsg2550.com www.tsg2550.com;

    # ไฟล์ใหญ่สุดที่รับได้ (เผื่ออนาคตมีฟอร์มอัปโหลด)
    client_max_body_size 10M;

    # gzip ให้ HTML/JSON — ไฟล์ static ของ Next มี .br/.gz ของตัวเองอยู่แล้ว
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass         http://127.0.0.1:4187;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # จำเป็นถ้าอนาคตใช้ streaming / websocket (Server Actions, RSC)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_buffering    off;
    }

    # ไฟล์ static ของ Next มี content hash ในชื่ออยู่แล้ว cache ยาวได้ปลอดภัย
    location /_next/static/ {
        proxy_pass http://127.0.0.1:4187;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        proxy_pass http://127.0.0.1:4187;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
